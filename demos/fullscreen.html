<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vollbild-Layout mit Flexbox</title>
  <style>
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
      flex-wrap: wrap;
    }
    article {
      flex: 1;
    }
    header, main, nav, article, aside, footer {
      border: 2px solid black;
      padding: 0.25rem;
      margin: 0.25rem;
      border-radius: 0.25rem;
    }
  </style>
</head>
<body>
  <header>Header</header>
  <main>
    <nav>Nav</nav>
    <article>Article</article>
    <aside>Aside</aside>
  </main>
  <footer>Footer</footer>
</body>
</html>
